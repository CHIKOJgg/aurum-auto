telegram:
  # ID from https://web.telegram.org/k/#-3978977082.
  channel_id: 3978977082
  channel_title: "Aurum Research Club"
  # Kept for backward-compatible config loading; NewMessage events do not poll.
  poll_interval_seconds: 20
  session_file: "runtime/telegram_user"
  notifications_enabled: true
  # Number of retries after the initial Saved Messages notification attempt.
  notification_retry_count: 1

trading:
  # Master switch: false archives signals without sending any MT5 orders.
  trading_enabled: true
  # false (default): Keep existing positions open when a new opposite signal arrives.
  # true: Automatically close existing positions on the symbol before executing a new signal.
  close_opposite_positions: false
  # Code base is exactly 1%. This YAML value only multiplies it.
  risk_multiplier: 1.0
  # Optional per-instrument risk multiplier overrides (e.g., XAUUSD: 3.0 for 3% risk).
  # symbol_risk_multipliers:
  #   XAUUSD: 3.0
  # Select one of the strategy IDs documented in README.md.
  exit_strategy: "sl_tp2"
  # Legacy/default target used by parsers and reports.
  take_profit_target: 2
  # ENTRY MODE SELECTION:
  # true  = PENDING LIMIT/STOP MODE: Always places a pending limit/stop order at exact signal entry price. Never enters at market.
  # false = AUTO MARKET/LIMIT MODE: Enters at market if quote is near entry price, otherwise places a pending limit order.
  strict_call_entry: false
  # false: archive calls without an image; true: also execute them in MT5.
  enable_indicator_2: false
  # Enter at market only while stop risk is within the inclusive 0.9R-1.1R range.
  min_market_risk_multiplier: 0.9
  max_market_risk_multiplier: 1.1
  # distance (R) from the call entry, even if risk slightly exceeds the band
  # (e.g. after lot rounding). 0 = disabled.
  # Also enter at market when the quote is within this fraction of the stop
  # distance (R) from the call entry, even if risk slightly exceeds the band
  # (e.g. after lot rounding). 0 = disabled.
  market_entry_tolerance_r: 0.25
  market_entry_tolerance_enabled: true
  # Cancel a pending order that has not been filled within this many minutes
  # after placement. 0 = keep pending orders forever.
  pending_timeout_minutes: 30
  pending_timeout_enabled: true
  # Skip entry when the current spread exceeds this limit in points.
  max_spread_points: 50
  # Per-instrument max spread points limit.
  # FX pairs: 50 points (5 pips), Gold: 80 points ($0.80), Indices: 500 points (5.0 index pts).
  symbol_max_spread_points:
    GBPUSD: 50
    EURUSD: 50
    XAUUSD: 80
    XAGUSD: 150
    DE40: 500
    US100: 500
  entry_spread_guard_enabled: true
  mt5_server_offset_hours: 3
  close_spread_hard_cap_minutes: 10
  exit_spread_guard_enabled: true
  # Hard timeout for every isolated MT5 execution subprocess.
  execution_timeout_seconds: 90
  # "fixed" uses mt5_server_offset_hours; "auto" detects offset from MT5.
  server_time_mode: "auto"
  # Skip entries inside news windows. Events are listed in news_events_file
  # as [{start_utc: "YYYY-MM-DDTHH:MM", title: "..."}]; windows before/after in
  # minutes. Both windows 0 = news filter disabled.
  news_events_file: "runtime/news_events.json"
  news_window_before_minutes: 10
  news_window_after_minutes: 15
  news_guard_enabled: true
  margin_guard_enabled: true
  # Round to the nearest hundredth and never request less than 0.01 lot.
  lot_step: 0.01
  deviation_points: 20
  send_attempts: 3
  retry_delay_seconds: 2
  magic_number: 397897
  default_commission_per_lot_usd: 7.0
  # Instruments recognized by the signal parser. FX pairs (6-letter codes)
  # are always accepted regardless of this list.
  allowed_symbols:
    - XAUUSD
    - XAGUSD
    - DE40
    - US100
  # Alias mapping: signal names → canonical symbol names.
  symbol_aliases:
    GOLD: XAUUSD
    SILVER: XAGUSD
    GERMANY40: DE40
    USNDAQ100: US100
  # Pending limits remain GTC after price reaches or crosses SL/TP.

accounts:
  - name: "fxpro_demo"
    enabled: true
    risk_base_usd: 510
    # Install/login to FxPro MT5, then set the exact path.
    terminal_path: "C:/Program Files/FxPro MT5/terminal64.exe"
    symbols:
      XAUUSD: "GOLD"
      XAGUSD: "SILVER"
      DE40: "#Germany40"
      US100: "#USNDAQ100"
      # Six-letter FX pairs (GBPUSD, GBPJPY, USDJPY, etc.) automatically use
      # the same name in MT5. Add an explicit mapping only if a broker differs.
    # Full commission charged for one lot (both sides, when applicable).
    commission_per_lot_usd:
      FOREX: 7.0
      XAUUSD: 7.0
      XAGUSD: 7.0
      US100: 1.5

  - name: "secondary_demo"
    enabled: false
    risk_base_usd: 25000
    terminal_path: "C:/Program Files/MetaTrader 5 Secondary/terminal64.exe"
    symbols:
      XAUUSD: "XAUUSD"
      DE40: "GER30"
      # US100 is intentionally omitted when this account must not trade it.
      # Example override for a broker-specific suffix:
      # GBPUSD: "GBPUSD.pro"
    commission_per_lot_usd:
      FOREX: 7.0
    # Percentage of entry notional: lot * contract size * price * rate.
    commission_rate_percent:
      XAUUSD: 0.0016

paths:
  state_file: "runtime/state.json"
  log_file: "logs/aurum_bot.log"
  lock_file: "runtime/aurum_bot.lock"
  # Cumulative archive of every complete call; a matching CSV is written too.
  calls_file: "data/all_calls.json"
  strategy_state_dir: "runtime/exit-strategies"

google_sheets:
  enabled: false
  # Create/repair the single-owner template and prefill its formulas.
  auto_setup: true
  spreadsheet_id: ""
  credentials_file: "runtime/google-service-account.json"
  account: "fxpro_demo"
  sync_interval_seconds: 120
  history_lookback_days: 45

runtime:
  # Every runtime feature is controlled here, without source-code edits.
  reconcile_on_startup: true
  exit_strategy_manager_enabled: true
  exit_strategy_poll_seconds: 2
  status_writer_enabled: true
  status_write_interval_seconds: 30
